<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
  <defs>
    <clipPath id="windowClip">
      <rect x="590" y="80" width="240" height="260" rx="20"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="880" height="440" fill="#5D38A4"/>

  <!-- Decorative gears top-left -->
  <g opacity="0.15" fill="#F72585">
    <circle cx="40" cy="40" r="25" stroke="#F72585" stroke-width="3" fill="none"/>
    <circle cx="40" cy="40" r="10" fill="#F72585"/>
    <rect x="36" y="10" width="8" height="12" rx="2" fill="#F72585"/>
    <rect x="36" y="58" width="8" height="12" rx="2" fill="#F72585"/>
    <rect x="10" y="36" width="12" height="8" rx="2" fill="#F72585"/>
    <rect x="58" y="36" width="12" height="8" rx="2" fill="#F72585"/>
    <circle cx="90" cy="70" r="18" stroke="#F72585" stroke-width="2" fill="none"/>
    <circle cx="90" cy="70" r="7" fill="#F72585"/>
  </g>

  <!-- Decorative zigzag waves top-right -->
  <g opacity="0.12">
    <polyline points="750,0 770,20 790,0 810,20 830,0 850,20 870,0 880,10" stroke="#F72585" stroke-width="3" fill="none"/>
    <polyline points="750,15 770,35 790,15 810,35 830,15 850,35 870,15 880,25" stroke="#9D4EDD" stroke-width="2" fill="none"/>
  </g>

  <!-- Decorative zigzag waves bottom-right -->
  <g opacity="0.12">
    <polyline points="750,420 770,400 790,420 810,400 830,420 850,400 870,420 880,410" stroke="#F72585" stroke-width="3" fill="none"/>
    <polyline points="750,435 770,415 790,435 810,415 830,435 850,415 870,435 880,425" stroke="#9D4EDD" stroke-width="2" fill="none"/>
  </g>

  <!-- Text section (left) -->
  <!-- Module name -->
  <text x="50" y="80" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#FFFFFF">SaaS Portal</text>

  <!-- Description (max 6 words per line) -->
  <text font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#E0D4F5" x="50">
    <tspan x="50" dy="60">Customer portal for SaaS</tspan>
    <tspan x="50" dy="28">instance management. View status,</tspan>
    <tspan x="50" dy="28">metrics, credentials, environment</tspan>
    <tspan x="50" dy="28">variables, and perform actions</tspan>
    <tspan x="50" dy="28">like restart and upgrade.</tspan>
  </text>

  <!-- Highlight points -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#FFFFFF">
    <circle cx="62" cy="290" r="6" fill="#F72585"/>
    <text x="76" y="295">Instance list &amp; detail dashboard</text>
    <circle cx="62" cy="318" r="6" fill="#F72585"/>
    <text x="76" y="323">Real-time CPU, RAM, Disk metrics</text>
    <circle cx="62" cy="346" r="6" fill="#F72585"/>
    <text x="76" y="351">Self-service restart &amp; upgrade</text>
    <circle cx="62" cy="374" r="6" fill="#F72585"/>
    <text x="76" y="379">Secure credentials &amp; env vars</text>
    <circle cx="62" cy="402" r="6" fill="#F72585"/>
    <text x="76" y="407">Portal record-rule security</text>
  </g>

  <!-- Illustration area (right) -->
  <rect x="590" y="80" width="240" height="260" rx="20" fill="#F5F5F5"/>

  <!-- Icon reproduction inside illustration -->
  <g transform="translate(640, 110) scale(1.8)">
    <ellipse cx="50" cy="42" rx="32" ry="20" fill="#714B67"/>
    <ellipse cx="30" cy="46" rx="18" ry="14" fill="#714B67"/>
    <ellipse cx="70" cy="46" rx="18" ry="14" fill="#714B67"/>
    <rect x="18" y="42" width="64" height="16" fill="#714B67"/>
    <rect x="28" y="50" width="44" height="30" rx="4" fill="#FFFFFF"/>
    <rect x="28" y="50" width="44" height="8" rx="4" fill="#00A09D"/>
    <rect x="28" y="56" width="44" height="2" fill="#00A09D"/>
    <circle cx="33" cy="54" r="1.5" fill="#FFFFFF"/>
    <circle cx="38" cy="54" r="1.5" fill="#FFFFFF"/>
    <circle cx="43" cy="54" r="1.5" fill="#FFFFFF"/>
    <circle cx="50" cy="67" r="5" fill="#714B67"/>
    <ellipse cx="50" cy="77" rx="8" ry="4" fill="#714B67"/>
  </g>

  <!-- CTA Button -->
  <a href="https://www.ganemo.co">
    <rect x="640" y="370" width="150" height="40" rx="20" fill="#F72585"/>
    <text x="715" y="395" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ganemo.co</text>
  </a>
</svg>
