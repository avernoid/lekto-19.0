<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 440" width="880" height="440">
    <!-- DYNAMIC ELEMENTS: headline, subtitle tspans, highlight bullets, illustration, CTA text/URL -->
    <rect width="880" height="440" fill="#5D38A4"/>

    <!-- Decorative gears, top left -->
    <g fill="none" stroke="#F72585" stroke-width="4" opacity="0.55">
        <circle cx="46" cy="42" r="20"/>
        <circle cx="46" cy="42" r="8"/>
        <circle cx="92" cy="76" r="12"/>
        <circle cx="92" cy="76" r="5"/>
    </g>

    <!-- Decorative zigzag waves, right corners -->
    <g fill="none" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M700 26 L724 50 L748 26 L772 50 L796 26 L820 50 L844 26" stroke="#F72585" opacity="0.7"/>
        <path d="M700 52 L724 76 L748 52 L772 76 L796 52 L820 76 L844 52" stroke="#8E6BD6" opacity="0.7"/>
        <path d="M700 388 L724 412 L748 388 L772 412 L796 388 L820 412 L844 388" stroke="#8E6BD6" opacity="0.7"/>
        <path d="M700 414 L724 438 L748 414 L772 438 L796 414 L820 438 L844 414" stroke="#F72585" opacity="0.7"/>
    </g>

    <!-- Main text box -->
    <rect x="40" y="110" width="470" height="270" rx="18" fill="#4A2B85" opacity="0.85"/>

    <text x="72" y="172" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF">
        Manufacturing
    </text>
    <text x="72" y="216" font-family="Montserrat, Arial, sans-serif" font-size="44" font-weight="800" fill="#F72585">
        Reclassification
    </text>

    <text font-family="Montserrat, Arial, sans-serif" font-size="19" fill="#E4DAF7">
        <tspan x="72" y="256">Break the counterpart of the</tspan>
        <tspan x="72" y="282">manufacturing entry down by</tspan>
        <tspan x="72" y="308">cost origin, without touching</tspan>
        <tspan x="72" y="334">the native valuation.</tspan>
    </text>

    <g font-family="Montserrat, Arial, sans-serif" font-size="16" font-weight="600" fill="#FFFFFF">
        <circle cx="80" cy="358" r="6" fill="#F72585"/>
        <text x="96" y="364">Materials, consumables and operations</text>
    </g>

    <!-- Illustration panel -->
    <rect x="560" y="120" width="280" height="200" rx="24" fill="#FFFFFF"/>
    <g transform="translate(600,150) scale(1.4)">
        <g transform="translate(26,50)">
            <g fill="#714B67">
                <rect x="-4" y="-27" width="8" height="10" rx="1.5"/>
                <rect x="-4" y="-27" width="8" height="10" rx="1.5" transform="rotate(45)"/>
                <rect x="-4" y="-27" width="8" height="10" rx="1.5" transform="rotate(90)"/>
                <rect x="-4" y="-27" width="8" height="10" rx="1.5" transform="rotate(135)"/>
                <rect x="-4" y="-27" width="8" height="10" rx="1.5" transform="rotate(180)"/>
                <rect x="-4" y="-27" width="8" height="10" rx="1.5" transform="rotate(225)"/>
                <rect x="-4" y="-27" width="8" height="10" rx="1.5" transform="rotate(270)"/>
                <rect x="-4" y="-27" width="8" height="10" rx="1.5" transform="rotate(315)"/>
                <circle r="19"/>
            </g>
            <circle r="8" fill="#B79EB5"/>
        </g>
        <g fill="none" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
            <path d="M47 50 H57 V19 H64" stroke="#00A09D"/>
            <path d="M47 50 H64" stroke="#FF9F6E"/>
            <path d="M47 50 H57 V81 H64" stroke="#1F8EFA"/>
        </g>
        <rect x="64" y="10" width="30" height="18" rx="4" fill="#00A09D"/>
        <rect x="64" y="41" width="30" height="18" rx="4" fill="#FF9F6E"/>
        <rect x="64" y="72" width="30" height="18" rx="4" fill="#1F8EFA"/>
    </g>

    <!-- CTA -->
    <rect x="640" y="346" width="160" height="52" rx="26" fill="#F72585"/>
    <text x="720" y="379" text-anchor="middle" font-family="Montserrat, Arial, sans-serif" font-size="22"
          font-weight="700" fill="#FFFFFF">ganemo.co</text>
</svg>
