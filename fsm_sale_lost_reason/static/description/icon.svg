<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Clipboard / Task Base (Purple) -->
  <rect x="20" y="15" width="60" height="75" rx="5" fill="#714B67"/>
  
  <!-- Paper Sheet (White) -->
  <rect x="25" y="20" width="50" height="65" rx="2" fill="#FFFFFF" opacity="0.9"/>
  
  <!-- Lines on paper (Teal) -->
  <rect x="30" y="30" width="40" height="4" rx="1" fill="#00A09D" opacity="0.5"/>
  <rect x="30" y="40" width="40" height="4" rx="1" fill="#00A09D" opacity="0.5"/>
  <rect x="30" y="50" width="25" height="4" rx="1" fill="#00A09D" opacity="0.5"/>

  <!-- Lost Reason Indicator (Question Mark in Circle) -->
  <circle cx="65" cy="70" r="18" fill="#F72585"/>
  <text x="65" y="77" font-family="Arial, sans-serif" font-weight="bold" font-size="22" fill="#FFFFFF" text-anchor="middle">?</text>
</svg>
