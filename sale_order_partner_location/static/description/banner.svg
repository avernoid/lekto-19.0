<svg width="750" height="371" viewBox="0 0 750 371" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!-- Background -->
    <rect width="750" height="371" fill="#5D38A4"/>
    
    <!-- Decorative Patterns -->
    <!-- Top Left: Gears/Abstract -->
    <path d="M0 0 L100 0 L0 100 Z" fill="#F72585" opacity="0.2"/>
    <circle cx="30" cy="30" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <circle cx="60" cy="10" r="10" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
    
    <!-- Top/Bottom Right: Zigzag -->
    <path d="M750 0 L650 0 L750 100 Z" fill="#F72585" opacity="0.2"/>
    <path d="M750 371 L650 371 L750 271 Z" fill="#9D4EDD" opacity="0.3"/>

    <!-- Left Content Box -->
    <g transform="translate(40, 60)">
        <!-- Title -->
        <text x="0" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="26" fill="#FFFFFF">
            Sale Order Partner Location
        </text>
        
        <!-- Description -->
        <text x="0" y="90" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">
            <tspan x="0" dy="0">Capture location when</tspan>
            <tspan x="0" dy="25">creating/confirming</tspan>
            <tspan x="0" dy="25">sales orders</tspan>
        </text>
        
        <!-- Highlights -->
        <g transform="translate(0, 170)">
            <circle cx="6" cy="6" r="6" fill="#F72585"/>
            <text x="20" y="11" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Auto-capture on confirm</text>
            
            <circle cx="6" cy="36" r="6" fill="#F72585"/>
            <text x="20" y="41" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Google Maps integration</text>
            
            <circle cx="6" cy="66" r="6" fill="#F72585"/>
            <text x="20" y="71" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Team configuration</text>
        </g>
    </g>

    <!-- Right Content Box (Illustration) -->
    <g transform="translate(480, 60)">
        <rect width="230" height="230" rx="20" ry="20" fill="#FFFFFF"/>
        <!-- Icon Image (Embedded SVG) -->
        <g transform="translate(15, 15) scale(2)">
            <!-- Sales Document (Purple) - Large -->
            <rect x="20" y="10" width="60" height="75" rx="5" fill="#714B67"/>
            <rect x="25" y="15" width="50" height="65" rx="2" fill="#FFFFFF" opacity="0.95"/>
            
            <!-- Document Lines (Teal) -->
            <rect x="30" y="25" width="40" height="4" rx="1" fill="#00A09D" opacity="0.6"/>
            <rect x="30" y="35" width="40" height="4" rx="1" fill="#00A09D" opacity="0.6"/>
            <rect x="30" y="45" width="25" height="4" rx="1" fill="#00A09D" opacity="0.6"/>
            
            <!-- Location Pin Badge (Teal) - Large -->
            <path d="M70 55 C62 55 56 61 56 69 C56 80 70 95 70 95 C70 95 84 80 84 69 C84 61 78 55 70 55 Z" fill="#00A09D"/>
            
            <!-- Pin Center (White) -->
            <circle cx="70" cy="69" r="6" fill="#FFFFFF"/>
            
            <!-- Pin Dot (Purple) -->
            <circle cx="70" cy="69" r="3" fill="#714B67"/>
        </g>
    </g>

    <!-- CTA Button -->
    <g transform="translate(530, 310)">
        <rect width="130" height="40" rx="20" ry="20" fill="#F72585"/>
        <text x="65" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle">ganemo.co</text>
    </g>
</svg>
