<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - Partner Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            text-align: center;
            padding: 2rem;
            color: #333;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .icon {
            font-size: 4rem;
            margin-bottom: 1rem;
            color: #6c757d;
        }
        h1 { margin-bottom: 0.5rem; }
        p { color: #6c757d; margin-bottom: 2rem; }
        .btn {
            display: inline-block;
            background-color: #007bff;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 0.5rem;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="icon">📡</div>
    <h1>You are Offline</h1>
    <p>Please check your internet connection to access the partner directory.</p>
    <a href="/my/partners" class="btn" onclick="window.location.reload()">Try Again</a>
</body>
</html>
