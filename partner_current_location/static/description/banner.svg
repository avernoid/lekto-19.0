<svg width="750" height="371" viewBox="0 0 750 371" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!-- Background -->
    <rect width="750" height="371" fill="#5D38A4"/>
    
    <!-- Decorative Patterns -->
    <!-- Top Left: Gears/Abstract -->
    <path d="M0 0 L100 0 L0 100 Z" fill="#F72585" opacity="0.2"/>
    <circle cx="30" cy="30" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <circle cx="60" cy="10" r="10" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
    
    <!-- Top/Bottom Right: Zigzag -->
    <path d="M750 0 L650 0 L750 100 Z" fill="#F72585" opacity="0.2"/>
    <path d="M750 371 L650 371 L750 271 Z" fill="#9D4EDD" opacity="0.3"/>

    <!-- Left Content Box -->
    <g transform="translate(40, 60)">
        <!-- Title -->
        <text x="0" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF">
            Partner Current Location
        </text>
        
        <!-- Description -->
        <text x="0" y="90" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">
            <tspan x="0" dy="0">Get partner coordinates</tspan>
            <tspan x="0" dy="25">from device current</tspan>
            <tspan x="0" dy="25">location</tspan>
        </text>
        
        <!-- Highlights -->
        <g transform="translate(0, 170)">
            <circle cx="6" cy="6" r="6" fill="#F72585"/>
            <text x="20" y="11" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Device GPS</text>
            
            <circle cx="6" cy="36" r="6" fill="#F72585"/>
            <text x="20" y="41" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">One-click update</text>
            
            <circle cx="6" cy="66" r="6" fill="#F72585"/>
            <text x="20" y="71" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Accurate positioning</text>
        </g>
    </g>

    <!-- Right Content Box (Illustration) -->
    <g transform="translate(480, 60)">
        <rect width="230" height="230" rx="20" ry="20" fill="#FFFFFF"/>
        <!-- Icon Image (Embedded SVG) -->
        <g transform="translate(15, 15) scale(2)">
            <!-- Contact/Partner Icon (Purple) - Larger -->
            <circle cx="40" cy="30" r="18" fill="#714B67"/>
            <path d="M15 85 Q15 60 40 60 Q65 60 65 85 L65 95 L15 95 Z" fill="#714B67"/>
            
            <!-- GPS/Location Indicator (Teal) - Larger -->
            <circle cx="75" cy="65" r="22" fill="#00A09D"/>
            
            <!-- Crosshair/Target (White) -->
            <circle cx="75" cy="65" r="10" fill="none" stroke="#FFFFFF" stroke-width="2.5"/>
            <line x1="75" y1="50" x2="75" y2="58" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="75" y1="72" x2="75" y2="80" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="60" y1="65" x2="68" y2="65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
            <line x1="82" y1="65" x2="90" y2="65" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="75" cy="65" r="3" fill="#FFFFFF"/>
            
            <!-- GPS Waves (Teal - subtle) -->
            <path d="M75 45 Q65 45 65 55" fill="none" stroke="#00A09D" stroke-width="2" opacity="0.4"/>
            <path d="M75 45 Q85 45 85 55" fill="none" stroke="#00A09D" stroke-width="2" opacity="0.4"/>
        </g>
    </g>

    <!-- CTA Button -->
    <g transform="translate(530, 310)">
        <rect width="130" height="40" rx="20" ry="20" fill="#F72585"/>
        <text x="65" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle">ganemo.co</text>
    </g>
</svg>
