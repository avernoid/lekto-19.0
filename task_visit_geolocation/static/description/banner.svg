<svg width="750" height="371" viewBox="0 0 750 371" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
    <!-- Background -->
    <rect width="750" height="371" fill="#5D38A4"/>
    
    <!-- Decorative Patterns -->
    <!-- Top Left: Gears/Abstract -->
    <path d="M0 0 L100 0 L0 100 Z" fill="#F72585" opacity="0.2"/>
    <circle cx="30" cy="30" r="20" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.3"/>
    <circle cx="60" cy="10" r="10" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.2"/>
    
    <!-- Top/Bottom Right: Zigzag -->
    <path d="M750 0 L650 0 L750 100 Z" fill="#F72585" opacity="0.2"/>
    <path d="M750 371 L650 371 L750 271 Z" fill="#9D4EDD" opacity="0.3"/>

    <!-- Left Content Box -->
    <g transform="translate(40, 60)">
        <!-- Title -->
        <text x="0" y="40" font-family="Arial, sans-serif" font-weight="bold" font-size="28" fill="#FFFFFF">
            Task Visit Geolocation
        </text>
        
        <!-- Description -->
        <text x="0" y="90" font-family="Arial, sans-serif" font-size="18" fill="#FFFFFF">
            <tspan x="0" dy="0">Add geolocation features</tspan>
            <tspan x="0" dy="25">to project tasks for</tspan>
            <tspan x="0" dy="25">visit registration</tspan>
        </text>
        
        <!-- Highlights -->
        <g transform="translate(0, 170)">
            <circle cx="6" cy="6" r="6" fill="#F72585"/>
            <text x="20" y="11" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">GPS tracking</text>
            
            <circle cx="6" cy="36" r="6" fill="#F72585"/>
            <text x="20" y="41" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Distance validation</text>
            
            <circle cx="6" cy="66" r="6" fill="#F72585"/>
            <text x="20" y="71" font-family="Arial, sans-serif" font-size="16" fill="#FFFFFF">Visit confirmation</text>
        </g>
    </g>

    <!-- Right Content Box (Illustration) -->
    <g transform="translate(480, 60)">
        <rect width="230" height="230" rx="20" ry="20" fill="#FFFFFF"/>
        <!-- Icon Image (Embedded SVG) -->
        <g transform="translate(15, 15) scale(2)">
            <!-- Location Pin Base (Teal) -->
            <path d="M50 20 C38 20 28 30 28 42 C28 58 50 80 50 80 C50 80 72 58 72 42 C72 30 62 20 50 20 Z" fill="#00A09D"/>
            
            <!-- Inner Circle (White) -->
            <circle cx="50" cy="42" r="12" fill="#FFFFFF"/>
            
            <!-- Checkmark/Visit Indicator (Purple) -->
            <path d="M46 42 L49 46 L55 38" fill="none" stroke="#714B67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            
            <!-- Geolocation Rings (Purple - subtle) -->
            <circle cx="50" cy="42" r="18" fill="none" stroke="#714B67" stroke-width="2" opacity="0.3"/>
            <circle cx="50" cy="42" r="22" fill="none" stroke="#714B67" stroke-width="1.5" opacity="0.2"/>
        </g>
    </g>

    <!-- CTA Button -->
    <g transform="translate(530, 310)">
        <rect width="130" height="40" rx="20" ry="20" fill="#F72585"/>
        <text x="65" y="25" font-family="Arial, sans-serif" font-weight="bold" font-size="16" fill="#FFFFFF" text-anchor="middle">ganemo.co</text>
    </g>
</svg>
