<svg xmlns="http://www.w3.org/2000/svg" width="880" height="440" viewBox="0 0 880 440">
  <!-- Store banner — Analytic Domain Report Engine.

       DYNAMIC elements (change per module):
         · headline            <text id="headline">
         · subtitle lines      <text id="subtitle"> / its <tspan> rows, max 6 words each
         · highlight bullets   <g id="bullets"> — circles r=6 #F72585
         · illustration        <g id="illustration"> — the module icon
         · CTA url             <text id="cta-url">
       STATIC elements: background, gear motif, zigzag waves, panel, CTA pill.

       Layout budget, checked for overlaps:
         panel        48,88   → 538,352
         illustration 596,120 → 832,316
         CTA pill     690,360 → 836,400
         bottom wave  y 418   → below the pill by 18px -->

  <rect width="880" height="440" fill="#5D38A4"/>

  <!-- Top-left gear: automation motif, fuchsia, clear of the panel (ends y=76) -->
  <g transform="translate(72 44)" fill="#F72585" opacity="0.75">
    <g id="gear-teeth">
      <rect x="-4.5" y="-30" width="9" height="12" rx="2"/>
      <rect x="-4.5" y="-30" width="9" height="12" rx="2" transform="rotate(45)"/>
      <rect x="-4.5" y="-30" width="9" height="12" rx="2" transform="rotate(90)"/>
      <rect x="-4.5" y="-30" width="9" height="12" rx="2" transform="rotate(135)"/>
      <rect x="-4.5" y="-30" width="9" height="12" rx="2" transform="rotate(180)"/>
      <rect x="-4.5" y="-30" width="9" height="12" rx="2" transform="rotate(225)"/>
      <rect x="-4.5" y="-30" width="9" height="12" rx="2" transform="rotate(270)"/>
      <rect x="-4.5" y="-30" width="9" height="12" rx="2" transform="rotate(315)"/>
    </g>
    <circle r="20"/>
    <circle r="8" fill="#5D38A4"/>
  </g>

  <!-- Top-right zigzag wave, peach -->
  <polyline points="566,34 596,58 626,34 656,58 686,34 716,58 746,34 776,58 806,34 836,58 866,34"
            fill="none" stroke="#FF9F6E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
            opacity="0.85"/>
  <!-- Bottom-right zigzag wave, teal -->
  <polyline points="566,418 596,398 626,418 656,398 686,418 716,398 746,418 776,398 806,418 836,398 866,418"
            fill="none" stroke="#00A09D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"
            opacity="0.85"/>

  <!-- Main text panel -->
  <rect x="48" y="88" width="490" height="264" rx="18"
        fill="#FFFFFF" fill-opacity="0.10" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="2"/>

  <text id="headline" x="76" y="146" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="38" font-weight="700" fill="#FFFFFF">Analytic Domain</text>

  <!-- Subtitle: 24px max, no line longer than 6 words -->
  <text id="subtitle" x="76" y="192" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="22" fill="#EADFFB">
    <tspan x="76" dy="0">Report lines that sum the</tspan>
    <tspan x="76" dy="30">distributed share of analytic items</tspan>
  </text>

  <!-- Highlight bullets: first at y=262, i.e. 40px below the last subtitle line -->
  <g id="bullets" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
     font-size="19" fill="#FFFFFF">
    <circle cx="86" cy="257" r="6" fill="#F72585"/>
    <text x="104" y="263">80% of a split expense, not 100%</text>
    <circle cx="86" cy="291" r="6" fill="#F72585"/>
    <text x="104" y="297">Filter and group by analytic account</text>
    <circle cx="86" cy="325" r="6" fill="#F72585"/>
    <text x="104" y="331">Formula assistant with measured costs</text>
  </g>

  <!-- Illustration: light rounded box holding the module icon, 140x140 centered -->
  <rect x="596" y="120" width="236" height="196" rx="20" fill="#FFFFFF" fill-opacity="0.95"/>
  <g id="illustration" transform="translate(644 148) scale(1.4)">
    <g fill="none" stroke-width="20" stroke-linecap="butt" transform="translate(50 50)">
      <circle r="30" stroke="#B79EB5" stroke-dasharray="34.7 153.8" transform="rotate(-90)"/>
      <circle r="30" stroke="#00A09D" stroke-dasharray="53.5 135.0" transform="rotate(-18)"/>
      <circle r="30" stroke="#714B67" stroke-dasharray="91.2 97.3" transform="rotate(90)"/>
    </g>
    <rect x="37" y="42" width="26" height="5" rx="2.5" fill="#FF9F6E"/>
    <rect x="37" y="53" width="17" height="5" rx="2.5" fill="#FF9F6E"/>
  </g>

  <!-- CTA -->
  <rect x="690" y="360" width="146" height="40" rx="20" fill="#F72585"/>
  <text id="cta-url" x="763" y="386" text-anchor="middle"
        font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="19" font-weight="600" fill="#FFFFFF">ganemo.co</text>
</svg>
