  <path d="M640 48 l20 -16 l20 16 l20 -16 l20 16 l20 -16 l20 16 l20 -16 l20 16 l20 -16 l20 16" fill="none" stroke="#00A09D" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>
  <!-- Zigzag bottom-right -->
  <path d="M620 412 l20 -16 l20 16 l20 -16 l20 16 l20 -16 l20 16 l20 -16 l20 16 l20 -16 l20 16 l20 -16 l20 16" fill="none" stroke="#F72585" stroke-width="5" stroke-linejoin="round" opacity="0.9"/>

  <!-- Text panel (left) -->
  <rect x="30" y="100" width="470" height="270" rx="22" fill="#4A2C86" stroke="#7B5CC4" stroke-width="2"/>
  <!-- DYNAMIC: headline -->
  <text x="56" y="152" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#FFFFFF">Dropship Shipping</text>
  <text x="56" y="190" font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="32" font-weight="800" fill="#FFC857">with Carriers</text>
  <!-- DYNAMIC: subtitle (lines of max 6 words) -->
  <text font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="19" fill="#E6DDF7">
    <tspan x="56" y="226">Real sender and recipient of a</tspan>
    <tspan x="56" y="251">dropship for carrier connectors.</tspan>
  </text>
  <!-- DYNAMIC: highlight bullets -->
  <g font-family="Montserrat, Arial, Helvetica, sans-serif" font-size="16" fill="#FFFFFF">
    <circle cx="64" cy="288" r="6" fill="#F72585"/><text x="80" y="294">Vendor as shipment origin</text>
    <circle cx="64" cy="318" r="6" fill="#F72585"/><text x="80" y="324">Purchase delivery address as recipient</text>
    <circle cx="64" cy="348" r="6" fill="#F72585"/><text x="80" y="354">Print Label on Dropship operations</text>
  </g>

  <!-- DYNAMIC: illustration box (right) with module icon -->
